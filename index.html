function mergeFT(){const have=new Set(CRTR.map(f=>f[0])),R={lock:60,bridge:25,aq:60,wind:30};
return FTR.filter(f=>!(have.has(f[0])&&R[f[0]]&&CRTR.some(c=>c[0]==f[0]&&dm({lat:c[1],lon:c[2]},{lat:f[1],lon:f[2]})<R[f[0]]))).concat(CRTR,JX)}
// leaving the route: reroute from the nearest canal point after a few seconds
let offT=0,lastRR=0,WL=null;
function offCheck(pr){const n=performance.now();if(pr.d<=80){offT=0;return false}if(!offT)offT=n;
if(n-offT>8e3&&n-lastRR>2e4&&LA.length&&DEST){const b=nv(pos.lat,pos.lon);if(dm(pos,{lat:LA[b],lon:LO[b]})>300)return false;lastRR=n;offT=0;ORIG=null;calc();if(RC.length>1)sim.s=proj(pos).s;toast('Rerouting…');return true}return false}
async function wake(){try{WL=await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(nav&&document.visibilityState=='visible')wake()});
const hp=(h,x)=>{h.push(x);let i=h.length-1;while(i&&h[i][0]<h[(i-1)>>1][0]){const p=(i-1)>>1;[h[i],h[p]]=[h[p],h[i]];i=p}};
const hpop=h=>{const t=h[0],l=h.pop();if(h.length){h[0]=l;let i=0;for(;;){let c=2*i+1;if(c>=h.length)break;if(c+1<h.length&&h[c+1][0]<h[c][0])c++;if(h[c][0]>=h[i][0])break;[h[i],h[c]]=[h[c],h[i]];i=c}}return t};
function netRoute(s,t){if(s==t)return 0;const n=LA.length,d=new Float64Array(n).fill(1e12),pv=new Int32Array(n).fill(-1),pe=[],h=[[0,s]];d[s]=0;
while(h.length){const[du,u]=hpop(h);if(du>d[u])continue;if(u==t)break;for(const[v,w,nm]of ADJ[u]){if(du+w<d[v]){d[v]=du+w;pv[v]=u;pe[v]=nm;hp(h,[d[v],v])}}}
if(d[t]>=1e12)return 0;const ix=[t];for(let c=t;c!=s;c=pv[c])ix.unshift(pv[c]);
RC=ix.map(i=>({lat:LA[i],lon:LO[i]}));for(let i=1;i<RC.length;i++)cd[i]=cd[i-1]+dm(RC[i-1],RC[i]);
ix.forEach((v,i)=>{if(i&&(!SG.length||SG[SG.length-1].n!=NM[pe[v]]))SG.push({n:NM[pe[v]],s:cd[i-1]})});
const on=new Map(ix.map((v,i)=>[v,i])),RTY=['lock','tunnel','aq','junc','wind'];
FT.forEach(f=>{if(!RTY.includes(f[0]))return;if(f[7]==null)f[7]=nv(f[1],f[2]);const i=on.get(f[7]);if(i!=null)WP.push({k:'f',s:cd[i],n:f[3],t:f[0]})});
WP.sort((x,y)=>x.s-y.s);WP.push({k:'d',s:cd[cd.length-1],n:DEST.n,t:'dest'});return 1}
function calc(){RC=[];WP=[];SG=[];cd=[0];sim.s=0;const o=ORIG||pos;upd();
if(!o){setRoute();return show('<h2>Set a start</h2><p class="sub">Tap “Set start…” above, then tap the canal or a place. Or turn on location.</p>')}
if(!LA.length){setRoute();return show('<h2>Canal data still loading…</h2><p class="sub">Try again in a moment.</p>')}
const s=nv(o.lat,o.lon),t=nv(DEST.lat,DEST.lon);
if(dm(o,{lat:LA[s],lon:LO[s]})>600||dm(DEST,{lat:LA[t],lon:LO[t]})>600){setRoute();return show('<h2>Too far from the canal</h2><p class="sub">The start and destination both need to be near a canal in the loaded area.</p>')}
const r=netRoute(s,t);setRoute();
if(!r)return show('<h2>No route found</h2><p class="sub">These points may not connect by canal in the loaded data.</p>');
const tot=cd[cd.length-1],mi=tot/1609.34,lk=WP.filter(w=>wt(w)=='lock').length;
show(`<div class="big"><b>${tf(mi/3+lk*5/60)}</b> <span class="sub">${mi.toFixed(1)} mi · ${lk} lock${lk==1?'':'s'}</span></div><div class="row"><button class="pri" onclick="startNav()">▶ Start</button></div><p><a href="https://canalrivertrust.org.uk/notices" target="_blank" rel="noopener">Check CRT notices before you go</a></p><ol>${SG.map((g,j)=>{const e=j<SG.length-1?SG[j+1].s:tot,W2=WP.filter(w=>w.s>g.s&&w.s<=e+1),l=[...W2].reverse().find(w=>!/^(Lock|Tunnel|Aqueduct|Winding hole)$/.test(wn(w)))||W2[W2.length-1]||WP[WP.length-1];return`<li>Follow <b>${g.n}</b> to <b>${wn(l)}</b> <small>${((e-g.s)/1609.34).toFixed(1)} mi</small></li>`}).join('')}</ol>`);if(!nav)fitRC()}
$('#sw').onclick=()=>{const o=ORIG||(pos&&{n:'My location',lat:pos.lat,lon:pos.lon});if(!o||!DEST)return;ORIG={n:DEST.n,lat:DEST.lat,lon:DEST.lon};DEST={n:o.n,lat:o.lat,lon:o.lon};calc()};
$('#stp').onclick=()=>{pickStart=true;toast('Tap the canal or a place to set the start')};
$('#dx').onclick=()=>{clearRoute();hide();setMode('explore')};
$('#gb').onclick=()=>{if(CUR)goTo();else if(DEST)go();else toast('Search or tap a place first')};
$('#ldt').onclick=()=>{if($('#ld').classList.contains('err')){loadNet()}};
// search + chips
const q=$('#q'),res=$('#res');
q.oninput=()=>{const v=q.value.trim().toLowerCase();if(!v){res.hidden=true;return}
const a=ALLP.map((p,i)=>[p,i]).filter(([p])=>p[3]&&p[3].toLowerCase().includes(v)).sort((x,y)=>(y[0][3].toLowerCase().startsWith(v)?1:0)-(x[0][3].toLowerCase().startsWith(v)?1:0)).slice(0,8).map(([p,i])=>`<div onclick="pickP(${i})">${(CAT[p[0]]||['📍'])[0]} <b>${esc(p[3])}</b><small>${(CAT[p[0]]||['','Place'])[1]}</small></div>`),
b=NM.map((n,i)=>[n,i]).filter(([n])=>n!='Canal'&&n.toLowerCase().includes(v)).slice(0,4).map(([n,i])=>`<div onclick="fitName(${i})">〰️ <b>${esc(n)}</b><small>Waterway</small></div>`);
res.innerHTML=a.concat(b).join('')||'<div>No matches yet. Data may still be loading.</div>';res.hidden=false};
function pickP(i){res.hidden=true;q.blur();placeSheet(featOf(i))}
function fitName(i){res.hidden=true;q.blur();const b=NB[i];if(b)map.fitBounds([[b[1],b[0]],[b[3],b[2]]],{padding:60,maxZoom:15})}
const QC=['lock','water','san','pub','moor','shop','toilet','weir'];
$('#chips').innerHTML=QC.map(k=>`<button class="chip" data-k="${k}">${CAT[k][0]} ${CAT[k][1]}</button>`).join('');
function setCat(k,on){if(on)pAct.add(k);else pAct.delete(k);if(on){if(FCAT.includes(k)){loadFT();loadCRT()}else loadPOI()}
document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',pAct.has(x.dataset.k)));const cb=document.querySelector(`#lay input[data-c="${k}"]`);if(cb)cb.checked=on;if(map.getLayer('poi'))map.setFilter('poi',poiFilter())}
$('#chips').onclick=e=>{const b=e.target.closest('.chip');if(b)setCat(b.dataset.k,!pAct.has(b.dataset.k))};
$('#nav').onclick=e=>{const m=e.target.closest('button')?.dataset.m;if(m=='go'){DEST?go():CUR?goTo():go()}else if(m=='saved')saved();else if(m=='explore'){clearRoute();hide();setMode('explore')}};
map.on('click',e=>{res.hidden=true;
if(sim.spoof&&$('#dsp').checked){setPos(e.lngLat.lat,e.lngLat.lng,sim.h);return}
if(nav)return;
const f=map.getLayer('poi')&&map.queryRenderedFeatures([[e.point.x-10,e.point.y-10],[e.point.x+10,e.point.y+10]],{layers:['poi']});let o=null;
if(f&&f.length)o=featOf(f[0].properties.i);
else if(LA.length){const b=nv(e.lngLat.lat,e.lngLat.lng),mpp=156543*Math.cos(e.lngLat.lat*rad)/2**map.getZoom();if(dm({lat:e.lngLat.lat,lon:e.lngLat.lng},{lat:LA[b],lon:LO[b]})<28*mpp)o={c:null,sub:'Canal point',n:(ADJ[b][0]&&NM[ADJ[b][0][2]])||'Canal',lat:LA[b],lon:LO[b]}}
if(pickStart){if(!o){toast('Tap the canal or a place');return}pickStart=false;ORIG={n:o.n||'Start',lat:o.lat,lon:o.lon};if(DEST)go();else toast('Start set. Now choose a destination.');return}
if(o)placeSheet(o,1);else if(mode=='explore'){CUR=null;hide()}});
$('#sty').onclick=()=>{dark=!dark;document.documentElement.dataset.theme=dark?'dark':'light';ready=true;map.setStyle(STY[+dark])};
function toast(t){const el=$('#toast');el.textContent=t;el.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.opacity=0,3200)}
// dev mode
$('#dvb').onclick=()=>$('#dev').hidden=!$('#dev').hidden;$('#dvx').onclick=()=>$('#dev').hidden=true;
$('#dsp').onchange=e=>{sim.spoof=e.target.checked?1:0;if(sim.spoof&&!pos){const c=map.getCenter();setPos(c.lat,c.lng,sim.h)}else if(!sim.spoof)watch()};
$('#dh').oninput=e=>{sim.h=+e.target.value;$('#dhv').textContent=sim.h+'°';if(sim.spoof&&tgt)setPos(tgt.lat,tgt.lon,sim.h)};
$('#dv').onchange=e=>sim.v=+e.target.value;
$('#dtp').onchange=e=>{const q=ALLP[+e.target.value];if(!q)return;const p={lat:q[1],lon:q[2]};$('#dsp').checked=true;sim.spoof=1;setPos(p.lat,p.lon,sim.h);if(!nav)map.flyTo({center:[p.lon,p.lat],zoom:15.5})};
$('#dc').onclick=e=>{sim.cruise=!sim.cruise;sim.follow=0;$('#dr').classList.remove('on');e.target.classList.toggle('on',!!sim.cruise);$('#dsp').checked=true;sim.spoof=1;if(!pos){const c=map.getCenter();setPos(c.lat,c.lng,sim.h)}};
$('#dr').onclick=e=>{if(RC.length<2)return toast('Plan a route first (➤ Go)');sim.follow=!sim.follow;sim.cruise=0;$('#dc').classList.remove('on');e.target.classList.toggle('on',!!sim.follow);$('#dsp').checked=true;sim.spoof=1;
if(sim.follow){const near0=pos&&proj(pos);if(near0&&near0.d<150)sim.s=near0.s;else{sim.s=0;const q=pointAt(0);setPos(q.lat,q.lon,q.h)}}};
setInterval(()=>{if(!sim.spoof)return;const dt=.2;
if(sim.follow&&RC.length>1){sim.s=Math.min(cd[cd.length-1],sim.s+sim.v*dt);const q=pointAt(sim.s);setPos(q.lat,q.lon,q.h)}
else if(sim.cruise&&tgt){const d=sim.v*dt,a=sim.h*rad;setPos(tgt.lat+Math.cos(a)*d/K,tgt.lon+Math.sin(a)*d/(K*Math.cos(tgt.lat*rad)),sim.h)}},200);
loadNet();map.on('load',()=>{fab()});
</script></body></html>

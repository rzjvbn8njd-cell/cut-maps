wid=navigator.geolocation.watchPosition(p=>{if(sim.spoof)return;const c=p.coords;setPos(c.latitude,c.longitude,c.heading!=null&&c.speed>.5?c.heading:null)},
e=>{wid=null;toast((['','Location blocked: allow it for this site (needs https).','Position unavailable.','Location timed out.'][e.code]||'Location unavailable.')+' Try 🛠 Dev mode.')},{enableHighAccuracy:true,maximumAge:2000,timeout:15000})}
$('#loc').onclick=()=>{startCompass();if(nav&&!follow){follow=true;return cam()}if(pos)map.flyTo({center:[pos.lon,pos.lat],zoom:15.5});else{toast('Locating…');watch()}};
// route progress
function proj(p){let b={d:1e12,s:0},acc=0;for(let i=0;i<RC.length-1;i++){const a=RC[i],c=RC[i+1],L=cd[i+1]-cd[i],k=Math.cos(a.lat*rad),ax=(c.lon-a.lon)*K*k,ay=(c.lat-a.lat)*K,px=(p.lon-a.lon)*K*k,py=(p.lat-a.lat)*K,t=L?Math.max(0,Math.min(1,(px*ax+py*ay)/(L*L))):0,d=Math.hypot(px-t*ax,py-t*ay);if(d<b.d)b={d,s:cd[i]+t*L};}return b}
function pointAt(s){let i=0;while(i<RC.length-2&&cd[i+1]<s)i++;const a=RC[i],b=RC[i+1],t=(s-cd[i])/((cd[i+1]-cd[i])||1);return{lat:a.lat+(b.lat-a.lat)*t,lon:a.lon+(b.lon-a.lon)*t,h:brg(a,b)}}
const tf=h=>h>=1?`${Math.floor(h)} h ${Math.round(h%1*60)} min`:`${Math.max(1,Math.round(h*60))} min`;
function hud(){if(RC.length<2||!pos||!WP.length)return;const pr=proj(pos),tot=cd[cd.length-1],rem=tot-pr.s,nx=WP.find(w=>w.s>pr.s+15)||WP[WP.length-1],sg=[...SG].reverse().find(x=>x.s<=pr.s)||SG[0],lk=WP.filter(w=>w.s>pr.s&&P[w.k][3]=='lock').length,mi=rem/1609.34;
$('#hi').textContent=rem<25?'You have arrived':'Continue on '+sg.n;
$('#hs').textContent=rem<25?P[WP[WP.length-1].k][0]:`to ${P[nx.k][0]} · ${Math.max(0,Math.round(nx.s-pr.s))} m${pr.d>80?' · off route':''}`;
$('#et').textContent=tf(mi/3+lk*5/60);$('#ed').textContent=`${mi.toFixed(1)} mi · ${lk} lock${lk==1?'':'s'}`}
function startNav(){startCompass();if(RC.length<2)return;if(!pos){const q=pointAt(0);setPos(q.lat,q.lon,q.h);toast('No GPS: starting at route start. Use 🛠 to spoof.')}
nav=true;follow=true;document.body.classList.add('nav');hide();cam();hud();fab()}
$('#ex').onclick=()=>{nav=false;document.body.classList.remove('nav');RT=[];RC=[];setRoute();vis();map.easeTo({bearing:0,pitch:45,zoom:15,padding:{top:0,bottom:0,left:0,right:0}});setMode('explore');fab()};
map.on('dragstart',e=>{if(nav&&e.originalEvent){follow=false;toast('Tap ◎ to recenter')}});
// sheet
const sheet=$('#sheet');
function show(h){sheet.innerHTML='<div class="grab"></div>'+h;sheet.classList.add('on');fab()}
function hide(){sheet.classList.remove('on');fab()}
function fab(){$('#fabs').style.bottom=(nav?96:sheet.classList.contains('on')?sheet.offsetHeight+66:70)+'px'}
function setMode(m){mode=m;$('#dir').hidden=m!='go';$('#top').hidden=m=='go';document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.m==m))}
let S=new Set();try{S=new Set(JSON.parse(localStorage.getItem('cut')||'[]'))}catch(e){}
function save(id){S.has(id)?S.delete(id):S.add(id);try{localStorage.setItem('cut',JSON.stringify([...S]))}catch(e){}place(id)}
function place(id,fly){sel=id;setMode('explore');const p=P[id];if(fly||1)map.flyTo({center:[p[2],p[1]],zoom:Math.max(map.getZoom(),14.5),speed:1.4});
show(`<h2>${p[0]}</h2><div class="sub">${T[p[3]][0]} ${T[p[3]][1]} · ${ways(id)}</div><div class="row"><button class="pri" onclick="go(null,'${id}')">➤ Directions</button><button onclick="save('${id}')">${S.has(id)?'★ Saved':'☆ Save'}</button><button onclick="share()">Share</button></div><p>${p[4]}</p><small>Illustrative demo data. Not for navigation.</small>`);vis()}
function share(){try{navigator.share({title:P[sel][0],text:P[sel][0]+' on the cut'}).catch(()=>{})}catch(e){toast('Sharing not available')}}
function saved(){setMode('saved');RT=[];RC=[];setRoute();show('<h2>Saved places</h2>'+(S.size?[...S].map(k=>`<div style="padding:10px 0;border-bottom:1px solid var(--line)" onclick="pick('${k}')">${T[P[k][3]][0]} <b>${P[k][0]}</b><br><small>${ways(k)}</small></div>`).join(''):'<p class="sub">Nothing saved yet. Tap ☆ Save on any place.</p>'))}
function go(a,b){setMode('go');if(b)Tt=b;if(a)F=a;else if(pos)F=near(pos);if(F==Tt)F=Tt=='lv'?'hert':'lv';
const o=s=>Object.keys(P).map(k=>`<option value="${k}"${k==s?' selected':''}>${P[k][0]}</option>`).join('');$('#f').innerHTML=o(F);$('#t').innerHTML=o(Tt);calc()}
const hp=(h,x)=>{h.push(x);let i=h.length-1;while(i&&h[i][0]<h[(i-1)>>1][0]){const p=(i-1)>>1;[h[i],h[p]]=[h[p],h[i]];i=p}};
const hpop=h=>{const t=h[0],l=h.pop();if(h.length){h[0]=l;let i=0;for(;;){let c=2*i+1;if(c>=h.length)break;if(c+1<h.length&&h[c+1][0]<h[c][0])c++;if(h[c][0]>=h[i][0])break;[h[i],h[c]]=[h[c],h[i]];i=c}}return t};
function netRoute(a,b){const s=SNAP[a],t=SNAP[b];if(s==null||t==null||s==t)return 0;const n=LA.length,d=new Float64Array(n).fill(1e12),pv=new Int32Array(n).fill(-1),pe=[],h=[[0,s]];d[s]=0;
while(h.length){const[du,u]=hpop(h);if(du>d[u])continue;if(u==t)break;for(const[v,w,nm]of ADJ[u]){if(du+w<d[v]){d[v]=du+w;pv[v]=u;pe[v]=nm;hp(h,[d[v],v])}}}
if(d[t]>=1e12)return 0;const ix=[t];for(let c=t;c!=s;c=pv[c])ix.unshift(pv[c]);
RC=ix.map(i=>({lat:LA[i],lon:LO[i]}));for(let i=1;i<RC.length;i++)cd[i]=cd[i-1]+dm(RC[i-1],RC[i]);
ix.forEach((v,i)=>{if(i&&(!SG.length||SG[SG.length-1].n!=NM[pe[v]]))SG.push({n:NM[pe[v]],s:cd[i-1]})});
const on=new Map(ix.map((v,i)=>[v,i]));Object.keys(P).forEach(k=>{const i=on.get(SNAP[k]);if(i!=null)WP.push({k,s:cd[i]})});WP.sort((x,y)=>x.s-y.s);return 1}
function calc(){RT=[];RC=[];WP=[];SG=[];cd=[0];sim.s=0;let r=F!=Tt&&netRoute(F,Tt),ap=0;
if(!r&&F!=Tt){const o=route(F,Tt);if(o){ap=1;RC=o.path.map(ll);for(let i=1;i<RC.length;i++)cd[i]=cd[i-1]+dm(RC[i-1],RC[i]);WP=o.path.map((k,i)=>({k,s:cd[i]}));o.ws.forEach((w,i)=>{if(!SG.length||SG[SG.length-1].w!=w)SG.push({n:W[w][0],w,s:cd[i]})});r=1}}
WPS=new Set(WP.map(w=>w.k));setRoute();vis();
if(!r)return show('<h2>No route</h2><p class="sub">Pick two different places.</p>');
const tot=cd[cd.length-1],mi=tot/1609.34,lk=WP.filter(w=>P[w.k][3]=='lock').length;
show(`<div class="big"><b>${tf(mi/3+lk*5/60)}</b> <span class="sub">${mi.toFixed(1)} mi · ${lk} lock${lk==1?'':'s'}${ap?' · approx.':''}</span></div><div class="row"><button class="pri" onclick="startNav()">▶ Start</button></div><ol>${SG.map((g,j)=>{const e=j<SG.length-1?SG[j+1].s:tot,l=[...WP].reverse().find(w=>w.s>g.s&&w.s<=e+1)||WP[WP.length-1];return`<li>Follow <b>${g.n}</b> to <b>${P[l.k][0]}</b> <small>${((e-g.s)/1609.34).toFixed(1)} mi</small></li>`}).join('')}</ol>`);fit(WP.map(w=>w.k))}
$('#f').onchange=e=>{F=e.target.value;calc()};$('#t').onchange=e=>{Tt=e.target.value;calc()};
$('#dx').onclick=()=>{RT=[];RC=[];setRoute();vis();hide();setMode('explore')};
$('#gb').onclick=()=>go(null,sel||Tt);
// search + chips
const q=$('#q'),res=$('#res');
q.oninput=()=>{const v=q.value.trim().toLowerCase();if(!v){res.hidden=true;return}
const a=Object.keys(P).filter(k=>(P[k][0]+' '+T[P[k][3]][1]).toLowerCase().includes(v)).slice(0,5).map(k=>`<div onclick="pick('${k}')">${T[P[k][3]][0]} <b>${P[k][0]}</b><small>${ways(k)}</small></div>`),
b=W.map((w,i)=>[w,i]).filter(([w])=>w[0].toLowerCase().includes(v)).map(([w,i])=>`<div onclick="fitW(${i})">〰️ <b>${w[0]}</b><small>Waterway</small></div>`);
res.innerHTML=a.concat(b).join('')||'<div>No matches</div>';res.hidden=false};
function pick(k){res.hidden=true;q.blur();place(k)}
function fitW(i){res.hidden=true;q.blur();fit(W[i][1])}
$('#chips').innerHTML=Object.entries(T).filter(([k])=>k!='junc').map(([k,v])=>`<button class="chip" data-k="${k}">${v[0]} ${v[1]}</button>`).join('');
$('#chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;flt=flt==b.dataset.k?null:b.dataset.k;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x.dataset.k==flt));
if(flt){const ids=Object.keys(P).filter(k=>P[k][3]==flt);fit(ids);show(`<h2>${T[flt][1]}s</h2>`+ids.map(k=>`<div style="padding:10px 0;border-bottom:1px solid var(--line)" onclick="pick('${k}')"><b>${P[k][0]}</b><br><small>${ways(k)}</small></div>`).join(''))}else hide();vis()};
$('#nav').onclick=e=>{const m=e.target.closest('button')?.dataset.m;if(m=='go')go(null,sel);else if(m=='saved')saved();else if(m=='explore'){RT=[];RC=[];setRoute();vis();hide();setMode('explore')}};
map.on('click',e=>{res.hidden=true;if(sim.spoof&&$('#dsp').checked){setPos(e.lngLat.lat,e.lngLat.lng,sim.h);return}if(mode=='explore'&&!nav){sel=null;hide();vis()}});
$('#sty').onclick=()=>{dark=!dark;document.documentElement.dataset.theme=dark?'dark':'light';ready=true;map.setStyle(STY[+dark])};
function toast(t){const el=$('#toast');el.textContent=t;el.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.opacity=0,3200)}
// dev mode
$('#dtp').innerHTML=Object.keys(P).map(k=>`<option value="${k}">${P[k][0]}</option>`).join('');
$('#dvb').onclick=()=>$('#dev').hidden=!$('#dev').hidden;$('#dvx').onclick=()=>$('#dev').hidden=true;
$('#dsp').onchange=e=>{sim.spoof=e.target.checked?1:0;if(sim.spoof&&!pos){const c=map.getCenter();setPos(c.lat,c.lng,sim.h)}else if(!sim.spoof)watch()};
$('#dh').oninput=e=>{sim.h=+e.target.value;$('#dhv').textContent=sim.h+'°';if(sim.spoof&&tgt)setPos(tgt.lat,tgt.lon,sim.h)};
$('#dv').onchange=e=>sim.v=+e.target.value;
$('#dtp').onchange=e=>{const p=ll(e.target.value);$('#dsp').checked=true;sim.spoof=1;setPos(p.lat,p.lon,sim.h);if(!nav)map.flyTo({center:[p.lon,p.lat],zoom:15.5})};
$('#dc').onclick=e=>{sim.cruise=!sim.cruise;sim.follow=0;$('#dr').classList.remove('on');e.target.classList.toggle('on',!!sim.cruise);$('#dsp').checked=true;sim.spoof=1;if(!pos){const c=map.getCenter();setPos(c.lat,c.lng,sim.h)}};
$('#dr').onclick=e=>{if(RC.length<2)return toast('Plan a route first (➤ Go)');sim.follow=!sim.follow;sim.cruise=0;$('#dc').classList.remove('on');e.target.classList.toggle('on',!!sim.follow);$('#dsp').checked=true;sim.spoof=1;
if(sim.follow){const near0=pos&&proj(pos);if(near0&&near0.d<150)sim.s=near0.s;else{sim.s=0;const q=pointAt(0);setPos(q.lat,q.lon,q.h)}}};
setInterval(()=>{if(!sim.spoof)return;const dt=.2;
if(sim.follow&&RC.length>1){sim.s=Math.min(cd[cd.length-1],sim.s+sim.v*dt);const q=pointAt(sim.s);setPos(q.lat,q.lon,q.h)}
else if(sim.cruise&&tgt){const d=sim.v*dt,a=sim.h*rad;setPos(tgt.lat+Math.cos(a)*d/K,tgt.lon+Math.sin(a)*d/(K*Math.cos(tgt.lat*rad)),sim.h)}},200);
vis();loadNet();map.on('load',()=>{vis();fab()});
</script></body></html>
